[project]
name = "torrent-client"
version = "0.1.0"
description = "Torrent client"
requires-python = ">=3.10"
dependencies = [
    "cachetools==6.2.4",
    "certifi==2025.11.12",
    "charset-normalizer==3.4.4",
    "greenlet==3.3.0",
    "idna==3.11",
    "libtorrent==2.0.11",
    "requests==2.32.5",
    "setuptools==80.9.0",
    "SQLAlchemy==2.0.45",
    "typing_extensions==4.15.0",
    "urllib3==2.6.2",
    "wheel==0.45.1"
]

[project.scripts]
torrent-client = "app:main"
torrentctl = "torrentctl:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "management", "sniff_scheduler", "torrentctl"]

[dependency-groups]
dev = []
